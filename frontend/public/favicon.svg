<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Orange rounded background -->
  <rect width="64" height="64" rx="16" fill="#E85D2A"/>
  <!-- Subtle inner gradient overlay -->
  <rect width="64" height="64" rx="16" fill="url(#grad)" opacity="0.4"/>
  <defs>
    <radialGradient id="grad" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c04010" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fork (left) -->
  <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Fork tines -->
    <line x1="21" y1="14" x2="21" y2="24"/>
    <line x1="25" y1="14" x2="25" y2="24"/>
    <line x1="29" y1="14" x2="29" y2="24"/>
    <!-- Fork arch -->
    <path d="M21 24 Q25 30 25 32"/>
    <path d="M29 24 Q25 30 25 32"/>
    <!-- Fork handle -->
    <line x1="25" y1="32" x2="25" y2="50"/>
  </g>

  <!-- Knife (right) -->
  <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Knife blade -->
    <path d="M39 14 C39 14 43 18 43 26 L39 28"/>
    <!-- Knife handle -->
    <line x1="39" y1="28" x2="39" y2="50"/>
  </g>
</svg>